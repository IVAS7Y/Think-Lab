[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "think-lab"
version = "0.1.0"
description = "Small, reliable research instrument file collector"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
think-lab = "think_lab:main"

[tool.hatch.build.targets.wheel]
only-include = ["think_lab.py"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["think_lab"]
